<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seguimiento SD — Acceso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="login-page">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Medistik" class="login-logo">
        <p class="brand-sub">Portal de Gestión de Solicitudes · Seguimiento SD</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} alert-dismissible fade show">
            {{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endwith %}

      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold">Usuario</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" name="username" class="form-control form-control-lg"
                   placeholder="Ingresa tu usuario" required autofocus autocomplete="username">
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" id="loginPassword"
                   class="form-control form-control-lg" placeholder="••••••••"
                   required autocomplete="current-password">
            <button type="button" class="btn btn-outline-secondary" id="toggleLoginPwd" tabindex="-1">
              <i class="bi bi-eye" id="iconLoginPwd"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100">
          <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
        </button>
      </form>

      <div class="text-center mt-3">
        <a href="{{ url_for('recuperar_password') }}" class="recover-link">
          <i class="bi bi-key me-1"></i>¿Olvidaste tu contraseña?
        </a>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('toggleLoginPwd').addEventListener('click', function() {
      const input = document.getElementById('loginPassword');
      const icon  = document.getElementById('iconLoginPwd');
      if (input.type === 'password') {
        input.type = 'text'; icon.className = 'bi bi-eye-slash';
      } else {
        input.type = 'password'; icon.className = 'bi bi-eye';
      }
    });
  </script>
</body>
</html>
