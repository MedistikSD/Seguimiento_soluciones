<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña — Seguimiento SD</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="login-page">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Medistik" class="login-logo">
        <p class="brand-sub">Recuperar contraseña</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} alert-dismissible fade show">
            {{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endwith %}

      <div class="alert" style="background:rgba(75,184,200,.1);border:1px solid rgba(75,184,200,.3);color:var(--turquesa);font-size:13px;">
        <i class="bi bi-info-circle me-1"></i>
        Ingresa tu usuario y define una nueva contraseña. Si no recuerdas tu usuario, contacta al administrador.
      </div>

      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold">Usuario</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" name="username" class="form-control" placeholder="Tu nombre de usuario" required autofocus>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Nueva contraseña</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="nueva_password" id="pwd1" class="form-control"
                   placeholder="Mínimo 6 caracteres" required minlength="6">
            <button type="button" class="btn btn-outline-secondary" onclick="togglePwd('pwd1','icon1')" tabindex="-1">
              <i class="bi bi-eye" id="icon1"></i>
            </button>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Confirmar contraseña</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" name="confirm_password" id="pwd2" class="form-control"
                   placeholder="Repite la contraseña" required minlength="6">
            <button type="button" class="btn btn-outline-secondary" onclick="togglePwd('pwd2','icon2')" tabindex="-1">
              <i class="bi bi-eye" id="icon2"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-3">
          <i class="bi bi-check-lg me-1"></i>Cambiar contraseña
        </button>
        <div class="text-center">
          <a href="{{ url_for('login') }}" class="recover-link">
            <i class="bi bi-arrow-left me-1"></i>Volver al login
          </a>
        </div>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function togglePwd(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon  = document.getElementById(iconId);
      if (input.type === 'password') { input.type = 'text'; icon.className = 'bi bi-eye-slash'; }
      else { input.type = 'password'; icon.className = 'bi bi-eye'; }
    }
  </script>
</body>
</html>
